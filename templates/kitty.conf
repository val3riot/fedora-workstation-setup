# workstation-setup: managed kitty config
# Kitty renders the terminal; tmux owns sessions, windows and panes.

font_family      monospace
font_size        11.5
disable_ligatures cursor

background       #1f2329
foreground       #d8dee9
selection_background #3b4252
selection_foreground #eceff4
cursor           #d8dee9
cursor_text_color #1f2329
cursor_shape     block
cursor_blink_interval 0
window_padding_width 8

# Readable, restrained dark palette (success/error/warning/network/Git/Docker/info).
color0  #2b3038
color8  #737b87
color1  #d06f79
color9  #e1848e
color2  #8eaf72
color10 #a3be8c
color3  #d0aa72
color11 #e5c07b
color4  #729bc4
color12 #81a1c1
color5  #b48ead
color13 #c49abb
color6  #78aeb3
color14 #88c0d0
color7  #c6ccd5
color15 #eceff4

scrollback_lines 20000
wheel_scroll_multiplier 3.0
url_style single
open_url_with default
detect_urls yes
copy_on_select no
clipboard_control write-clipboard write-primary read-clipboard-ask
enable_audio_bell no
confirm_os_window_close 0
shell zsh

# Keep Ctrl+b and ordinary tmux keys untouched. Kitty owns only GUI operations.
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+u kitten hints --type url
